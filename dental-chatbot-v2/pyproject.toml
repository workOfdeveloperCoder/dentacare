[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-chatbot"
version = "2.0.0"
description = "JSON-driven website chatbot. Change flow.json to change the bot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn>=0.53.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["app*"]
